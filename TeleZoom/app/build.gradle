plugins { id 'com.android.application' }

android {
    namespace 'com.fluxsniffer.telezoom'
    compileSdk 34
    defaultConfig {
        applicationId "com.fluxsniffer.telezoom"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    // Xposed API — provided at runtime by LSPosed, so compileOnly.
    compileOnly 'de.robv.android.xposed:api:82'
}
